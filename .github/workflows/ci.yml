name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Show bash version
        run: bash --version

      - name: Run end-to-end tests
        run: make test

  test-bash-versions:
    name: Test bash versions (documented as 4.0+ via ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show bash version
        run: bash --version

      - name: Note on bash compatibility
        run: |
          echo "cliwrap is tested on:"
          echo "  - ubuntu-latest (bash 5.x, GNU tools)"
          echo "  - macos-latest (bash 5.x via brew, BSD tools)"
          echo "Bash 4.0+ is the minimum requirement; see README.md"

  install:
    name: Install + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Install to prefix
        run: |
          PREFIX="$RUNNER_TEMP/install" ./install.sh
          echo "$RUNNER_TEMP/install/bin" >> "$GITHUB_PATH"

      - name: Verify binary works
        run: |
          cliwrap --version
          cliwrap doctor
          cliwrap wrap aws
          cliwrap new aws whoami --desc "test"
          cliwrap list
