name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version

      - name: Run end-to-end tests
        run: make test

  install:
    name: Install + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install to prefix
        run: |
          PREFIX="$RUNNER_TEMP/install" ./install.sh
          echo "$RUNNER_TEMP/install/bin" >> "$GITHUB_PATH"

      - name: Verify binary works
        run: |
          cliwrap --version
          cliwrap doctor
          cliwrap wrap aws
          cliwrap new aws whoami --desc "test"
          cliwrap list
